<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The dataset grows 10x; the UI thread's memory doesn't</title>
<desc id="d">From 100k to 1M rows, data on disk rises linearly to about 123 MB while the UI thread's JS heap stays flat near 25 MB.</desc>
<style>
  .t1 { fill: #1a1a1a; }
  .t2 { fill: #555555; }
  .t3 { fill: #777770; }
  .grid { stroke: #dddddd; }
  .axis { stroke: #b3b3b3; }
  .disk { stroke: #c2410c; }
  .diskf { fill: #c2410c; }
  .diskt { fill: #9a3412; }
  .heap { stroke: #1a4a8a; }
  .heapf { fill: #1a4a8a; }
  .heapt { fill: #163d72; }
  @media (prefers-color-scheme: dark) {
    .t1 { fill: #e6e6e6; }
    .t2 { fill: #a8a8a8; }
    .t3 { fill: #8f8f8f; }
    .grid { stroke: #3a3a3a; }
    .axis { stroke: #5a5a5a; }
    .disk { stroke: #ff9a62; }
    .diskf { fill: #ff9a62; }
    .diskt { fill: #ffb289; }
    .heap { stroke: #7ba9e0; }
    .heapf { fill: #7ba9e0; }
    .heapt { fill: #9fc1ea; }
  }
</style>
<text x="36" y="32" font-size="20" font-weight="600" class="t1">The dataset grows &#215;10; the UI thread&#8217;s memory doesn&#8217;t</text>
<text x="36" y="53" font-size="12.5" class="t2">Real Chrome, production build &#183; 21-column table, on-demand mode</text>
<g stroke-width="1" class="grid">
<line x1="80" y1="360" x2="680" y2="360"/>
<line x1="80" y1="320" x2="680" y2="320"/>
<line x1="80" y1="280" x2="680" y2="280"/>
<line x1="80" y1="240" x2="680" y2="240"/>
<line x1="80" y1="200" x2="680" y2="200"/>
<line x1="80" y1="160" x2="680" y2="160"/>
<line x1="80" y1="120" x2="680" y2="120"/>
<line x1="80" y1="80" x2="680" y2="80"/>
</g>
<g font-size="12" text-anchor="end" class="t2">
<text x="72" y="364">0</text>
<text x="72" y="324">20</text>
<text x="72" y="284">40</text>
<text x="72" y="244">60</text>
<text x="72" y="204">80</text>
<text x="72" y="164">100</text>
<text x="72" y="124">120</text>
<text x="72" y="84">140</text>
</g>
<text x="24" y="220" font-size="12" text-anchor="middle" transform="rotate(-90 24 220)" class="t2">megabytes</text>
<line x1="80" y1="80" x2="80" y2="360" stroke-width="1.5" class="axis"/>
<line x1="80" y1="360" x2="680" y2="360" stroke-width="1.5" class="axis"/>
<g font-size="11" text-anchor="middle" class="t2">
<text x="80" y="378">100k</text>
<text x="213" y="378">300k</text>
<text x="347" y="378">500k</text>
<text x="480" y="378">700k</text>
<text x="613" y="378">900k</text>
</g>
<text x="380" y="398" font-size="12" text-anchor="middle" class="t2">rows</text>
<line x1="80" y1="335.4" x2="680" y2="114.2" stroke-width="2.5" class="disk"/>
<circle cx="80" cy="335.4" r="4.5" class="diskf"/>
<circle cx="680" cy="114.2" r="4.5" class="diskf"/>
<text x="680" y="103" font-size="12" font-weight="600" text-anchor="end" class="diskt">122.9 MB</text>
<text x="98" y="350" font-size="11" class="diskt">12.3 MB</text>
<line x1="80" y1="310" x2="680" y2="310" stroke-width="2.5" class="heap"/>
<circle cx="680" cy="310" r="4.5" class="heapf"/>
<text x="680" y="330" font-size="12" font-weight="600" text-anchor="end" class="heapt">~25 MB (flat)</text>
<g font-size="12">
<rect x="100" y="96" width="14" height="3" rx="1.5" class="diskf"/>
<text x="120" y="101" class="t2">data on disk (durable client-side cache)</text>
<rect x="100" y="116" width="14" height="3" rx="1.5" class="heapf"/>
<text x="120" y="121" class="t2">UI-thread JS heap</text>
</g>
<text x="36" y="424" font-size="11" class="t3">Dots mark direct measurements; the disk line&#8217;s linearity was confirmed at both ends. Total tab RAM at 1M: ~227 MB while browsing;</text>
<text x="36" y="440" font-size="11" class="t3">a full export briefly holds ~479 MB. The dataset lives in the on-disk cache, so what the UI thread holds never tracks dataset size.</text>
</svg>
